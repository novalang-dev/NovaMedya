<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js"></script>
  <title>Nova Medya - Ana Sayfa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.js"></script>
  <style>
    :root {
      --bg-color: #0f1419;
      --card-bg: #15202b;
      --text-color: #f7f9f9;
      --border-color: #38444d;
      --accent-color: #8a2be2;
      --subtext-color: #8899a6;
      --hype-color: #ff4500;
      --danger-color: #ff4d4d;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --card-bg: #f0f3f5;
      --text-color: #0f1419;
      --border-color: #e1e8ed;
      --subtext-color: #5b7083;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
    }

    .app-container {
      display: flex;
      width: 100%;
      max-width: 1250px;
      min-height: 100vh;
    }

    /* SOL MENÜ */
    .sidebar-left {
      width: 250px;
      padding: 1rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      padding: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.05rem;
      padding: 0.75rem 1rem;
      border-radius: 25px;
      cursor: pointer;
      color: var(--text-color);
      text-decoration: none;
      transition: background 0.2s;
      position: relative;
    }

    .nav-item:hover { background-color: var(--card-bg); }

    .nav-item.active {
      color: var(--accent-color) !important;
      font-weight: bold;
      background-color: var(--card-bg);
    }

    .notif-badge {
      background-color: var(--danger-color);
      color: white;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 10px;
      position: absolute;
      right: 15px;
    }

    /* ORTA AKIŞ */
    .feed-center {
      flex: 1;
      max-width: 600px;
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
    }

    .feed-header {
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .create-post {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .create-post textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.1rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }

    .post-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
    }

    .file-btn {
      color: var(--accent-color);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .submit-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .post-card {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .post-header {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    .badge-icon { font-size: 0.9rem; }
    .badge-founder { color: #ffd700; }
    .badge-verified { color: #00bfff; }
    .badge-trend { color: #ff4500; }

    .media-container img, .media-container video {
      width: 100%;
      border-radius: 12px;
      margin-top: 0.8rem;
    }

    .post-footer {
      display: flex;
      gap: 2rem;
      margin-top: 0.8rem;
      color: var(--subtext-color);
      font-size: 0.95rem;
    }

    .action-icon {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }

    .action-icon:hover { color: var(--accent-color); }
    .action-icon.hyped { color: var(--hype-color); }

    .hashtag {
      color: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
    }

    /* SAĞ SÜTUN WIDGETS */
    .sidebar-right {
      width: 350px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
    }

    .widget-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem;
    }

    .widget-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .widget-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .widget-item:last-child { border-bottom: none; }

    /* MODALLAR (BİLDİRİM & YORUM) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .modal-body {
      padding: 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .comment-item {
      display: flex;
      gap: 0.8rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- SOL MENÜ -->
    <div class="sidebar-left">
      <div class="logo"><i class="fa-solid fa-rocket"></i> NOVA MEDYA</div>
      <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
      <a href="search.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Ara</a>
      <a href="videos.html" class="nav-item"><i class="fa-solid fa-film"></i> Videolar</a>
      
      <!-- BİLDİRİM POP-UP BUTONU -->
      <div class="nav-item" onclick="openNotifModal()">
        <i class="fa-solid fa-bell"></i> Bildirimler
        <span class="notif-badge" id="notifCount" style="display:none;">0</span>
      </div>

      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profilim</a>
      <div style="flex-grow: 1;"></div>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Ayarlar</a>
      <div class="nav-item" id="logoutBtn" style="color: var(--danger-color);"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </div>

    <!-- ORTA AKIŞ -->
    <div class="feed-center">
      <div class="feed-header"><i class="fa-solid fa-house"></i> Ana Sayfa</div>

      <!-- GÖNDERİ OLUŞTURMA -->
      <div class="create-post">
        <textarea id="postContent" rows="3" placeholder="Neler oluyor? #NovaMedya"></textarea>
        <div class="post-actions-bar">
          <label class="file-btn">
            <i class="fa-solid fa-image"></i>
            <input type="file" id="postMediaInput" accept="image/*,video/*" hidden>
          </label>
          <span id="selectedFileName" style="font-size:0.8rem; color:var(--subtext-color);"></span>
          <button class="submit-btn" id="sendPostBtn">Paylaş 🚀</button>
        </div>
      </div>

      <!-- GÖNDERİ LİSTESİ -->
      <div id="postsFeed"></div>
    </div>

    <!-- SAĞ SÜTUN (KEŞFET WIDGETS) -->
    <div class="sidebar-right">
      <!-- TREND GÖNDERİLER -->
      <div class="widget-card">
        <div class="widget-title"><i class="fa-solid fa-fire" style="color:var(--hype-color);"></i> Trend Gönderiler</div>
        <div id="trendPostsWidget">Yükleniyor...</div>
      </div>

      <!-- KİMİ TAKİP ETMELİ -->
      <div class="widget-card">
        <div class="widget-title"><i class="fa-solid fa-user-plus" style="color:var(--accent-color);"></i> Kimi Takip Etmeli?</div>
        <div id="whoToFollowWidget">Yükleniyor...</div>
      </div>
    </div>

  </div>

  <!-- 🔔 BİLDİRİM POP-UP MODAL -->
  <div class="modal-overlay" id="notifModal">
    <div class="modal-content">
      <div class="modal-header">
        <span><i class="fa-solid fa-bell"></i> Bildirimler</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeNotifModal()"></i>
      </div>
      <div class="modal-body" id="notifList">Yükleniyor...</div>
    </div>
  </div>

  <!-- 💬 YORUM POP-UP MODAL -->
  <div class="modal-overlay" id="commentModal">
    <div class="modal-content">
      <div class="modal-header">
        <span><i class="fa-solid fa-comments"></i> Yorumlar</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeCommentModal()"></i>
      </div>
      <div class="modal-body">
        <div id="commentList"></div>
      </div>
      <div style="padding:1rem; border-top:1px solid var(--border-color); display:flex; gap:0.5rem;">
        <input type="text" id="commentInput" placeholder="Yorumunu yaz..." style="flex:1; padding:0.6rem; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); outline:none;">
        <button class="submit-btn" id="sendCommentBtn">Gönder</button>
      </div>
    </div>
  </div>

  <script>
    const pb = new PocketBase('https://nova-medya-backend.onrender.com');
    pb.autoCancellation(false);

    if (!pb.authStore.isValid) {
      window.location.href = 'login.html';
    }

    const myUser = pb.authStore.model;
    let activePostForComment = null;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      pb.authStore.clear();
      window.location.href = 'login.html';
    });

    function renderBadges(userBadges) {
      let badgeHtml = '';
      if (!userBadges) return badgeHtml;
      const badges = Array.isArray(userBadges) ? userBadges : [userBadges];
      if (badges.includes('Founder')) badgeHtml += ' <i class="fa-solid fa-rocket badge-icon badge-founder"></i>';
      if (badges.includes('Verified')) badgeHtml += ' <i class="fa-solid fa-bolt badge-icon badge-verified"></i>';
      if (badges.includes('Trend')) badgeHtml += ' <i class="fa-solid fa-fire badge-icon badge-trend"></i>';
      return badgeHtml;
    }

    function getAvatarUrl(user) {
      if (user?.avatar) return pb.files.getUrl(user, user.avatar);
      return user?.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=Nova1';
    }

    // HASHTAG (#) BİÇİMLENDİRME
    function formatHashtags(text) {
      if (!text) return '';
      return text.replace(/#(\w+)/g, '<span class="hashtag" onclick="window.location.href=\'search.html?q=$1\'">#$1</span>');
    }

    // MEDYA DOSYASI SEÇİLDİĞİNDE
    document.getElementById('postMediaInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      document.getElementById('selectedFileName').textContent = file ? file.name : '';
    });

    // GÖNDERİ PAYLAŞMA
    document.getElementById('sendPostBtn').addEventListener('click', async () => {
      const content = document.getElementById('postContent').value.trim();
      const mediaFile = document.getElementById('postMediaInput').files[0];

      if (!content && !mediaFile) return alert('Lütfen bir metin veya medya ekleyin!');

      try {
        const formData = new FormData();
        formData.append('content', content);
        formData.append('author', myUser.id);
        formData.append('hypes', 0);
        if (mediaFile) formData.append('media', mediaFile);

        await pb.collection('posts').create(formData);
        document.getElementById('postContent').value = '';
        document.getElementById('postMediaInput').value = '';
        document.getElementById('selectedFileName').textContent = '';
        loadPosts();
      } catch (err) {
        alert("Gönderi paylaşılamadı: " + err.message);
      }
    });

    // GÖNDERİLERİ ÇEKME
    async function loadPosts() {
      const feed = document.getElementById('postsFeed');
      try {
        const records = await pb.collection('posts').getFullList({
          sort: '-created',
          expand: 'author'
        });

        feed.innerHTML = '';
        records.forEach(post => {
          const author = post.expand?.author || {};
          const mediaUrl = post.media ? pb.files.getUrl(post, post.media) : null;
          
          let mediaHtml = '';
          if (mediaUrl) {
            if (post.media.endsWith('.mp4') || post.media.endsWith('.webm')) {
              mediaHtml = `<div class="media-container"><video src="${mediaUrl}" controls></video></div>`;
            } else {
              mediaHtml = `<div class="media-container"><img src="${mediaUrl}"></div>`;
            }
          }

          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <div class="post-header">
              <img src="${getAvatarUrl(author)}" class="avatar" onclick="window.location.href='profile.html?id=${author.id}'">
              <div>
                <strong>${author.name || 'Nova Kullanıcısı'}</strong>${renderBadges(author.badges)}
                <div style="color:var(--subtext-color); font-size:0.85rem;">@${author.username}</div>
              </div>
            </div>
            <p>${formatHashtags(post.content)}</p>
            ${mediaHtml}
            <div class="post-footer">
              <div class="action-icon" onclick="hypePost('${post.id}', ${post.hypes || 0}, '${author.id}')">
                <i class="fa-solid fa-rocket"></i> <span>${post.hypes || 0}</span> Hype
              </div>
              <div class="action-icon" onclick="openCommentModal('${post.id}')">
                <i class="fa-solid fa-comment"></i> Yorum
              </div>
            </div>
          `;
          feed.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // HYPE (🚀) BUTONU & BİLDİRİM GÖNDERME
    // HYPE (🚀) BUTONU - TAM GÜVENLİ
async function hypePost(postId, currentHypes, authorId) {
  try {
    // 1. Önce Hype sayısını güncelle (Bildirim hata verse bile bu çalışır)
    await pb.collection('posts').update(postId, {
      'hypes': currentHypes + 1
    });

    // 2. Bildirim oluşturmayı dene (Başarısız olursa catch yakalar, akış kesilmez)
    if (authorId && authorId !== 'undefined' && authorId !== myUser.id) {
      try {
        await pb.collection('notifications').create({
          user: authorId,
          actor: myUser.id,
          type: 'hype',
          post: postId,
          read: false
        });
      } catch (notifErr) {
        console.warn("Bildirim kaydı oluşturulamadı (PocketBase alan ayarlarını kontrol edin):", notifErr);
      }
    }

    // 3. Ekranda Hype sayısını anında güncelle
    loadPosts();
    loadWidgets();
  } catch (err) {
    console.error("Hype güncellenirken hata oluştu:", err);
  }
}

    // 🔔 BİLDİRİM MODAL İŞLEMLERİ
    async function checkUnreadNotifications() {
      try {
        const notifs = await pb.collection('notifications').getFullList({
          filter: `user = "${myUser.id}" && read = false`
        });
        const badge = document.getElementById('notifCount');
        if (notifs.length > 0) {
          badge.textContent = notifs.length;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      } catch (err) {}
    }

    async function openNotifModal() {
      document.getElementById('notifModal').classList.add('active');
      const list = document.getElementById('notifList');
      list.innerHTML = 'Yükleniyor...';

      try {
        const notifs = await pb.collection('notifications').getFullList({
          sort: '-created',
          filter: `user = "${myUser.id}"`,
          expand: 'actor'
        });

        if (notifs.length === 0) {
          list.innerHTML = '<p style="color:var(--subtext-color);">Henüz bildiriminiz yok.</p>';
          return;
        }

        list.innerHTML = '';
        notifs.forEach(async n => {
          const actor = n.expand?.actor || {};
          let text = n.type === 'hype' ? 'gönderini Hype\'ladı! 🚀' : 'gönderine yorum yaptı. 💬';
          
          const item = document.createElement('div');
          item.className = 'notif-item';
          item.innerHTML = `
            <img src="${getAvatarUrl(actor)}" style="width:36px; height:36px; border-radius:50%;">
            <div><strong>@${actor.username}</strong> ${text}</div>
          `;
          list.appendChild(item);

          // Okundu olarak işaretle
          if (!n.read) await pb.collection('notifications').update(n.id, { read: true });
        });

        checkUnreadNotifications();
      } catch (err) { console.error(err); }
    }

    function closeNotifModal() { document.getElementById('notifModal').classList.remove('active'); }

    // 💬 YORUM MODAL İŞLEMLERİ
    async function openCommentModal(postId) {
      activePostForComment = postId;
      document.getElementById('commentModal').classList.add('active');
      loadComments(postId);
    }

    function closeCommentModal() { document.getElementById('commentModal').classList.remove('active'); }

    async function loadComments(postId) {
      const list = document.getElementById('commentList');
      list.innerHTML = 'Yükleniyor...';
      try {
        const comments = await pb.collection('comments').getFullList({
          sort: 'created',
          filter: `post = "${postId}"`,
          expand: 'user'
        });

        if (comments.length === 0) {
          list.innerHTML = '<p style="color:var(--subtext-color);">Henüz yorum yok. İlk yorumu sen yap!</p>';
          return;
        }

        list.innerHTML = '';
        comments.forEach(c => {
          const u = c.expand?.user || {};
          const item = document.createElement('div');
          item.className = 'comment-item';
          item.innerHTML = `
            <img src="${getAvatarUrl(u)}" style="width:32px; height:32px; border-radius:50%;">
            <div>
              <strong style="font-size:0.85rem;">@${u.username}</strong>
              <div style="font-size:0.9rem; margin-top:0.2rem;">${c.content}</div>
            </div>
          `;
          list.appendChild(item);
        });
      } catch (err) { console.error(err); }
    }

    document.getElementById('sendCommentBtn').addEventListener('click', async () => {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !activePostForComment) return;

      try {
        await pb.collection('comments').create({
          post: activePostForComment,
          user: myUser.id,
          content: text
        });

        // Gönderi sahibini bulup bildirim düş
        const post = await pb.collection('posts').getOne(activePostForComment);
        if (post.author !== myUser.id) {
          await pb.collection('notifications').create({
            user: post.author,
            actor: myUser.id,
            type: 'comment',
            post: post.id,
            read: false
          });
        }

        input.value = '';
        loadComments(activePostForComment);
      } catch (err) { alert("Yorum eklenemedi: " + err.message); }
    });

    // SAĞ SÜTUN WIDGET'LARINI DOLDURMA
    // SAĞ SÜTUN WIDGET'LARINI DOLDURMA (GÜVENLİ HALE GETİRİLDİ)
    async function loadWidgets() {
      // 1. Trend Gönderiler (En Çok Hype Alanlar)
      try {
        const topPosts = await pb.collection('posts').getList(1, 3, {
          sort: '-hypes',
          expand: 'author'
        });
        
        const trendDiv = document.getElementById('trendPostsWidget');
        trendDiv.innerHTML = '';

        if (topPosts.items.length === 0) {
          trendDiv.innerHTML = '<p style="font-size:0.85rem; color:var(--subtext-color);">Henüz gönderi yok.</p>';
        } else {
          topPosts.items.forEach(p => {
            const item = document.createElement('div');
            item.className = 'widget-item';
            item.innerHTML = `
              <span style="font-size:0.85rem; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:180px;">${p.content || 'Medya İçeriği'}</span> 
              <strong style="color:var(--hype-color);">🚀 ${p.hypes || 0}</strong>
            `;
            trendDiv.appendChild(item);
          });
        }
      } catch (e) {
        console.error("Trend widget hatası:", e);
        document.getElementById('trendPostsWidget').innerHTML = '<p style="font-size:0.85rem; color:var(--subtext-color);">Gönderi yok.</p>';
      }

      // 2. Kimi Takip Etmeli (Diğer Kullanıcılar)
      try {
        const users = await pb.collection('users').getList(1, 5, {
          sort: '-created'
        });
        
        const followDiv = document.getElementById('whoToFollowWidget');
        followDiv.innerHTML = '';

        const otherUsers = users.items.filter(u => u.id !== myUser.id);

        if (otherUsers.length === 0) {
          followDiv.innerHTML = '<p style="font-size:0.85rem; color:var(--subtext-color);">Önerilecek kullanıcı yok.</p>';
        } else {
          otherUsers.slice(0, 3).forEach(u => {
            const item = document.createElement('div');
            item.className = 'widget-item';
            item.innerHTML = `
              <div style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;" onclick="window.location.href='profile.html?id=${u.id}'">
                <img src="${getAvatarUrl(u)}" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
                <span style="font-size:0.85rem; font-weight:bold;">@${u.username}</span>
              </div>
            `;
            followDiv.appendChild(item);
          });
        }
      } catch (e) {
        console.error("Takip widget hatası:", e);
        document.getElementById('whoToFollowWidget').innerHTML = '<p style="font-size:0.85rem; color:var(--subtext-color);">Kullanıcı yok.</p>';
      }
    }

    loadPosts();
    checkUnreadNotifications();
    loadWidgets();
    setInterval(checkUnreadNotifications, 10000); // 10 saniyede bir bildirim kontrolü
  </script>
</body>
</html>
