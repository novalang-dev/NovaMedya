<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js"></script>
  <title>Nova Medya - Ara</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.js"></script>
  <style>
    :root {
      --bg-color: #0f1419;
      --card-bg: #15202b;
      --text-color: #f7f9f9;
      --border-color: #38444d;
      --accent-color: #8a2be2;
      --subtext-color: #8899a6;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
    }

    /* AKTİF MENÜ ELEMANI (TÜM TEMALAR İÇİN) */
.nav-item.active {
  color: var(--accent-color) !important;
  font-weight: bold;
  background-color: var(--card-bg);
}

.nav-item.active i {
  color: var(--accent-color) !important;
}

/* AYDINLIK MOD (LIGHT THEME) ÖZEL İYİLEŞTİRMELERİ */
[data-theme="light"] {
  --bg-color: #ffffff;
  --card-bg: #f0f3f5;
  --text-color: #0f1419;
  --border-color: #e1e8ed;
  --subtext-color: #5b7083;
}

    .app-container {
      display: flex;
      width: 100%;
      max-width: 1250px;
      min-height: 100vh;
    }

    .sidebar-left {
      width: 250px;
      padding: 1rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      padding: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.05rem;
      padding: 0.75rem 1rem;
      border-radius: 25px;
      cursor: pointer;
      color: var(--text-color);
      text-decoration: none;
    }

    .nav-item:hover { background-color: var(--card-bg); }

    .feed-center {
      flex: 1;
      max-width: 600px;
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
    }

    .search-box {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--subtext-color);
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 0.8rem 0.8rem 0.8rem 2.8rem;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
    }

    .user-card:hover { background-color: var(--card-bg); }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }

    .badge-icon { font-size: 0.85rem; margin-left: 0.2rem; }
    .badge-founder { color: #ffd700; }
    .badge-verified { color: #00bfff; }
    .badge-trend { color: #ff4500; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar-left">
      <div class="logo"><i class="fa-solid fa-rocket"></i> NOVA MEDYA</div>
      <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
      <a href="search.html" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i> Ara</a>
      <a href="videos.html" class="nav-item"><i class="fa-solid fa-film"></i> Videolar</a>
      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profilim</a>
      <div style="flex-grow: 1;"></div>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Ayarlar</a>
      <div class="nav-item" id="logoutBtn" style="color: #ff4d4d;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </div>

    <div class="feed-center">
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Kullanıcı veya içerik ara..." autocomplete="off">
        </div>
      </div>

      <div id="searchResults">
        <p style="padding: 1rem; color: var(--subtext-color);">Arama yapmak için yukarıya bir şeyler yazın.</p>
      </div>
    </div>
  </div>

  <script>
    const pb = new PocketBase('https://nova-medya-backend.onrender.com');
    pb.autoCancellation(false);

    if (!pb.authStore.isValid) {
      window.location.href = 'login.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      pb.authStore.clear();
      window.location.href = 'login.html';
    });

    function renderBadges(userBadges) {
      let badgeHtml = '';
      if (!userBadges) return badgeHtml;
      const badges = Array.isArray(userBadges) ? userBadges : [userBadges];
      if (badges.includes('Founder')) badgeHtml += ' <i class="fa-solid fa-rocket badge-icon badge-founder"></i>';
      if (badges.includes('Verified')) badgeHtml += ' <i class="fa-solid fa-bolt badge-icon badge-verified"></i>';
      if (badges.includes('Trend')) badgeHtml += ' <i class="fa-solid fa-fire badge-icon badge-trend"></i>';
      return badgeHtml;
    }

    function getAvatarUrl(user) {
      if (user.avatar) return pb.files.getUrl(user, user.avatar);
      return user.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=Nova1';
    }

    let searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();

      if (!query) {
        document.getElementById('searchResults').innerHTML = '<p style="padding: 1rem; color: var(--subtext-color);">Arama yapmak için yukarıya bir şeyler yazın.</p>';
        return;
      }

      searchTimeout = setTimeout(async () => {
        try {
          const users = await pb.collection('users').getFullList({
            filter: `name ~ "${query}" || username ~ "${query}"`
          });

          const resultsDiv = document.getElementById('searchResults');
          resultsDiv.innerHTML = '';

          if (users.length === 0) {
            resultsDiv.innerHTML = '<p style="padding: 1rem; color: var(--subtext-color);">Kullanıcı bulunamadı.</p>';
            return;
          }

          users.forEach(user => {
            const card = document.createElement('div');
            card.className = 'user-card';
            card.onclick = () => window.location.href = `profile.html?id=${user.id}`;
            card.innerHTML = `
              <img src="${getAvatarUrl(user)}" class="user-avatar">
              <div>
                <div><strong>${user.name || 'Nova Kullanıcısı'}</strong>${renderBadges(user.badges)}</div>
                <div style="color: var(--subtext-color); font-size: 0.85rem;">@${user.username}</div>
              </div>
            `;
            resultsDiv.appendChild(card);
          });
        } catch (err) {
          console.error("Arama hatası:", err);
        }
      }, 300);
    });
  </script>
</body>
</html>
