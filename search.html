<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js"></script>
  <title>Nova Medya - Ara</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.js"></script>
  <style>
    :root {
      --bg-color: #0f1419;
      --card-bg: #15202b;
      --text-color: #f7f9f9;
      --border-color: #38444d;
      --accent-color: #8a2be2;
      --subtext-color: #8899a6;
      --hype-color: #ff4500;
      --danger-color: #ff4d4d;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --card-bg: #f0f3f5;
      --text-color: #0f1419;
      --border-color: #e1e8ed;
      --subtext-color: #5b7083;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
    }

    .app-container {
      display: flex;
      width: 100%;
      max-width: 1250px;
      min-height: 100vh;
    }

    /* SOL MENÜ */
    .sidebar-left {
      width: 250px;
      padding: 1rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      padding: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.05rem;
      padding: 0.75rem 1rem;
      border-radius: 25px;
      cursor: pointer;
      color: var(--text-color);
      text-decoration: none;
      transition: background 0.2s;
    }

    .nav-item:hover { background-color: var(--card-bg); }

    .nav-item.active {
      color: var(--accent-color) !important;
      font-weight: bold;
      background-color: var(--card-bg);
    }

    /* ORTA İÇERİK */
    .main-content {
      flex: 1;
      max-width: 650px;
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    .page-header {
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .search-bar-container {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      padding: 0.6rem 1rem;
      gap: 0.8rem;
    }

    .search-input-wrapper input {
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 1rem;
      width: 100%;
      outline: none;
    }

    .results-container {
      padding: 1rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 1.2rem 0 0.8rem 0;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* KULLANICI KARTI */
    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem;
      border-radius: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 0.8rem;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .user-card:hover {
      transform: translateY(-2px);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    .badge-icon { font-size: 0.85rem; }
    .badge-founder { color: #ffd700; }
    .badge-verified { color: #00bfff; }
    .badge-trend { color: #ff4500; }

    /* GÖNDERİ KARTI */
    .post-card {
      padding: 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 0.8rem;
    }

    .post-header {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .hashtag {
      color: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- SOL MENÜ -->
    <div class="sidebar-left">
      <div class="logo"><i class="fa-solid fa-rocket"></i> NOVA MEDYA</div>
      <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
      <a href="search.html" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i> Ara</a>
      <a href="videos.html" class="nav-item"><i class="fa-solid fa-film"></i> Videolar</a>
      <a href="index.html" class="nav-item"><i class="fa-solid fa-bell"></i> Bildirimler</a>
      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profilim</a>
      <div style="flex-grow: 1;"></div>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Ayarlar</a>
      <div class="nav-item" id="logoutBtn" style="color: var(--danger-color);"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </div>

    <!-- ORTA ARAMA ALANI -->
    <div class="main-content">
      <div class="page-header"><i class="fa-solid fa-magnifying-glass"></i> Keşfet ve Ara</div>

      <div class="search-bar-container">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--subtext-color);"></i>
          <input type="text" id="searchInput" placeholder="Kullanıcı adı, isim veya #etiket ara...">
        </div>
      </div>

      <div class="results-container" id="searchResults">
        <p style="color:var(--subtext-color); text-align:center; margin-top:2rem;">
          Aramak istediğin kelimeyi yukarıdaki kutucuğa yazabilirsin.
        </p>
      </div>
    </div>

  </div>

  <script>
    const pb = new PocketBase('https://nova-medya-backend.onrender.com');
    pb.autoCancellation(false);

    if (!pb.authStore.isValid) {
      window.location.href = 'login.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      pb.authStore.clear();
      window.location.href = 'login.html';
    });

    function renderBadges(userBadges) {
      let badgeHtml = '';
      if (!userBadges) return badgeHtml;
      const badges = Array.isArray(userBadges) ? userBadges : [userBadges];
      if (badges.includes('Founder')) badgeHtml += ' <i class="fa-solid fa-rocket badge-icon badge-founder"></i>';
      if (badges.includes('Verified')) badgeHtml += ' <i class="fa-solid fa-bolt badge-icon badge-verified"></i>';
      if (badges.includes('Trend')) badgeHtml += ' <i class="fa-solid fa-fire badge-icon badge-trend"></i>';
      return badgeHtml;
    }

    function getAvatarUrl(user) {
      if (user?.avatar) return pb.files.getUrl(user, user.avatar);
      return user?.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=Nova1';
    }

    function formatHashtags(text) {
      if (!text) return '';
      return text.replace(/#(\w+)/g, '<span class="hashtag" onclick="triggerSearch(\'$1\')">#$1</span>');
    }

    const searchInput = document.getElementById('searchInput');
    let searchTimeout = null;

    // URL'den parametre kontrolü (örn: search.html?q=NovaMedya)
    const urlParams = new URLSearchParams(window.location.search);
    const queryParam = urlParams.get('q');
    if (queryParam) {
      searchInput.value = queryParam;
      performSearch(queryParam);
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      
      if (!query) {
        document.getElementById('searchResults').innerHTML = `
          <p style="color:var(--subtext-color); text-align:center; margin-top:2rem;">
            Aramak istediğin kelimeyi yukarıdaki kutucuğa yazabilirsin.
          </p>`;
        return;
      }

      // 300ms bekleyip aramayı çalıştır (performans için)
      searchTimeout = setTimeout(() => {
        performSearch(query);
      }, 300);
    });

    function triggerSearch(tag) {
      searchInput.value = tag;
      performSearch(tag);
    }

    async function performSearch(query) {
  const resultsContainer = document.getElementById('searchResults');
  resultsContainer.innerHTML = '<p style="color:var(--subtext-color); text-align:center; margin-top:2rem;">Aranıyor...</p>';

  try {
    const cleanQuery = query.replace('#', '').trim();

    // 1. KULLANICILARDA ARAMA
    const userResults = await pb.collection('users').getFullList({
      filter: `username ~ "${cleanQuery}" || name ~ "${cleanQuery}"`
    });

    // 2. GÖNDERİLERDE ARAMA
    const postResults = await pb.collection('posts').getFullList({
      filter: `content ~ "${cleanQuery}"`,
      sort: '-created',
      expand: 'author'
    });

    resultsContainer.innerHTML = '';

    // KULLANICI SONUÇLARI
    if (userResults.length > 0) {
      const userHeader = document.createElement('div');
      userHeader.className = 'section-title';
      userHeader.innerHTML = '<i class="fa-solid fa-users"></i> Kullanıcılar';
      resultsContainer.appendChild(userHeader);

      userResults.forEach(u => {
        const uCard = document.createElement('div');
        uCard.className = 'user-card';
        uCard.onclick = () => window.location.href = `profile.html?id=${u.id}`;
        uCard.innerHTML = `
          <div class="user-info">
            <img src="${getAvatarUrl(u)}" class="avatar">
            <div>
              <strong>${u.name || u.username || 'Nova Kullanıcısı'}</strong>${renderBadges(u.badges)}
              <div style="color:var(--subtext-color); font-size:0.85rem;">@${u.username || 'nova_kullanicisi'}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color:var(--subtext-color);"></i>
        `;
        resultsContainer.appendChild(uCard);
      });
    }

    // GÖNDERİ SONUÇLARI (GÜVENLİ AUTHOR/USER OKUMA)
    if (postResults.length > 0) {
      const postHeader = document.createElement('div');
      postHeader.className = 'section-title';
      postHeader.innerHTML = '<i class="fa-solid fa-newspaper"></i> Gönderiler & Etiketler';
      resultsContainer.appendChild(postHeader);

      postResults.forEach(post => {
        let author = post.expand?.author || {};
        if (Array.isArray(author)) author = author[0] || {};

        // Undefined kalmaması için güvenli değişkenler
        const authorUsername = author.username || 'nova_medya';
        const authorName = author.name || author.username || 'NMedya';
        const authorId = author.id || post.author || '';

        const pCard = document.createElement('div');
        pCard.className = 'post-card';
        pCard.innerHTML = `
          <div class="post-header">
            <img src="${getAvatarUrl(author)}" class="avatar" style="width:36px; height:36px; cursor:pointer;" onclick="window.location.href='profile.html?id=${authorId}'">
            <div>
              <strong>${authorName}</strong>${renderBadges(author.badges)}
              <div style="color:var(--subtext-color); font-size:0.8rem;">@${authorUsername}</div>
            </div>
          </div>
          <p>${formatHashtags(post.content)}</p>
        `;
        resultsContainer.appendChild(pCard);
      });
    }

    if (userResults.length === 0 && postResults.length === 0) {
      resultsContainer.innerHTML = `
        <p style="color:var(--subtext-color); text-align:center; margin-top:2rem;">
          "${query}" için hiçbir kullanıcı veya gönderi bulunamadı.
        </p>`;
    }

  } catch (err) {
    console.error("Arama hatası:", err);
    resultsContainer.innerHTML = '<p style="color:var(--danger-color); text-align:center; margin-top:2rem;">Arama yapılırken bir hata oluştu.</p>';
  }
}
  </script>
</body>
</html>
